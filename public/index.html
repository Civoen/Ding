<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Ding!</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ding!">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-startup-image" href="splash/splash-1179x2556-light.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-1290x2796-light.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Work+Sans:wght@500;600;700;800&display=swap">
<style>
/* Sticker Book: graph-paper ground, thick ink outlines, hard offset shadows, one colour per food.
   Layout: native-style app shell. White header under the iPhone's own light status bar, one scrolling panel, fixed tab bar. */
:root{
  --paper:#F6F5EE; --grid:#E4E2D6; --card:#FFFFFF; --soft:#EFEDE3;
  --ink:#111111; --text:#111111; --muted:#4A4A44;
  --primary:#2F49F0; --on-primary:#FFFFFF;
  --mustard:#FFC21A; --lime:#B9F27C; --tomato:#FF5A36; --late:#D7261E;
  --tape:#FFFFFF; --on-tape:#111111;
  --scrim:rgba(17,17,17,.45);
  --f-display:"Dela Gothic One","Arial Black","Helvetica Neue",sans-serif;
  --f-body:"Work Sans",-apple-system,system-ui,sans-serif;
  --sh:4px; --bw:2.5px;
}
/* One bright look in every setting, including iPhone Dark Mode. */
:root{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--card);color:var(--text);overscroll-behavior:none}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- shell ---------- */
.shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.top{flex:none;background:var(--tape);color:var(--on-tape);border-bottom:3px solid var(--ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-size:21px;background:var(--mustard);color:#111;padding:2px 10px 4px;transform:rotate(-2deg);border:2.5px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);line-height:1.1}
.top-r{display:flex;align-items:center;gap:10px}
.clock{font-weight:800;font-size:17px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
.iconbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.iconbtn svg{width:22px;height:22px}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-attachment:local}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}
.tabs{flex:none;background:var(--card);border-top:3px solid var(--ink);padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 8px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:560px;margin:0 auto}
.tab{border:var(--bw) solid transparent;background:none;border-radius:14px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:13px;color:var(--text);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--mustard);color:#111;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:800}
.tab .dot{position:absolute;top:5px;right:calc(50% - 22px);width:11px;height:11px;border-radius:50%;background:var(--tomato);border:2px solid var(--ink)}

/* ---------- building blocks ---------- */
.stk{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}
.h1{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.02;margin:2px 0 0;text-wrap:balance}
.lead{margin:-8px 0 0;color:var(--muted);font-weight:500;font-size:15px}
.label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.btn{border:var(--bw) solid var(--ink);background:var(--card);color:var(--text);border-radius:14px;box-shadow:3px 3px 0 var(--ink);min-height:48px;padding:8px 14px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform 60ms,box-shadow 60ms}
.btn:active,.chip:active,.tab:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--primary);color:var(--on-primary);font-family:var(--f-display);font-weight:400}
.btn.yes{background:var(--lime);color:#111}
.btn.go{background:var(--mustard);color:#111}
.btn.warn{background:var(--late);color:#fff}
.btn.ghost{box-shadow:none;border-style:dashed;background:transparent}
.btn.ghost:active{transform:none;background:var(--soft)}
.btn.big{width:100%;min-height:58px;font-family:var(--f-display);font-weight:400;font-size:19px;border-width:3px;border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
.btn.big:active{transform:translate(4px,4px)}
.btn.sm{min-height:40px;padding:4px 12px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px 2px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ink);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;min-height:40px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--ink);transition:transform 60ms,box-shadow 60ms}
.chip svg{width:17px;height:17px}
.chip[aria-pressed="true"]{background:var(--mustard);color:#111}
.chip.added{background:var(--lime);color:#111}
.pill{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:#111;background:var(--soft)}
.pill.waiting{background:var(--card);color:var(--text)}
.pill.start{background:var(--mustard)}
.pill.cooking{background:var(--tomato)}
.pill.ready{background:var(--primary);color:var(--on-primary)}
.pill.done,.pill.ok{background:var(--lime)}
.pill.late{background:var(--late);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.seg button{border:0;background:transparent;min-height:46px;font-weight:700;font-size:15px;color:var(--text)}
.seg button+button{border-left:var(--bw) solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--mustard);color:#111;font-weight:800}
.input{width:100%;border:var(--bw) solid var(--ink);background:var(--card);border-radius:14px;padding:10px 14px;min-height:50px;font-size:17px;box-shadow:inset 3px 3px 0 var(--soft)}
.input:focus{outline:none;border-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px}
.swatch{flex:none;width:16px;align-self:stretch;min-height:40px;border-radius:6px;border:2px solid var(--ink)}
.dev{width:22px;height:22px;flex:none}
.note{border:2.5px dashed var(--ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.note b{font-weight:800}
.note.warn{background:var(--mustard);color:#111;border-style:solid}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 8px}
.empty p{margin:0;color:var(--muted);font-weight:500;max-width:30ch}

/* starburst: an ink burst behind a coloured one gives the sticker outline */
.burst-o{position:absolute;width:132px;height:132px;background:var(--ink);clip-path:var(--star)}
.burst{position:absolute;inset:4px;clip-path:var(--star);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;text-align:center}
:root{--star:polygon(50% 0%,60.6% 10.4%,75% 6.7%,79% 21%,93.3% 25%,89.6% 39.4%,100% 50%,89.6% 60.6%,93.3% 75%,79% 79%,75% 93.3%,60.6% 89.6%,50% 100%,39.4% 89.6%,25% 93.3%,21% 79%,6.7% 75%,10.4% 60.6%,0% 50%,10.4% 39.4%,6.7% 25%,21% 21%,25% 6.7%,39.4% 10.4%)}
.burst .cd{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.burst .cd.long{font-size:21px}
.burst .cdk{font-weight:800;font-size:12px;margin-top:2px}

/* ---------- COOK ---------- */
.servebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.serve{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.serve .t{font-family:var(--f-display);font-size:26px;line-height:1}
.serve .orig{font-size:13px;font-weight:600;color:var(--muted)}
.hero{position:relative;padding:16px;display:flex;flex-direction:column;gap:6px;transform:rotate(-1deg);margin:4px 2px}
.hero .badge{align-self:flex-start;border:var(--bw) solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:800;font-size:13px;letter-spacing:.08em;background:var(--primary);color:var(--on-primary)}
.hero.start .badge{background:var(--mustard);color:#111}
.hero.ready .badge{background:var(--tomato);color:#111}
.hero.alldone .badge{background:var(--lime);color:#111}
.hero .what{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1;margin:0;max-width:calc(100% - 136px);overflow-wrap:anywhere;text-wrap:balance}
.hero .meta{font-weight:600;font-size:15px;max-width:calc(100% - 132px)}
.hero .cdl{font-weight:600;font-size:14px;color:var(--muted);min-height:1.4em}
.hero .cdl.nag{color:var(--late);font-weight:800}
.hero .burst-o{right:10px;top:12px;transform:rotate(8deg)}
.hero .act{display:flex;gap:10px;margin-top:8px}
.hero .act .btn.big{flex:1}
.hero .act .btn.side{flex:0 0 28%}
.hero.start .burst-o,.hero.ready .burst-o{animation:jiggle 1.1s ease-in-out infinite}
@keyframes jiggle{0%,100%{transform:rotate(8deg) scale(1)}50%{transform:rotate(-4deg) scale(1.06)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:15px}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border:2px solid var(--ink);border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(300px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.hero.start .burst-o,.hero.ready .burst-o{animation:none}.confetti{display:none}}
.then{display:flex;flex-direction:column;gap:3px;padding:0 6px;font-size:15px;font-weight:600}
.then div{display:flex;gap:10px;align-items:center}
.then b{font-weight:800;min-width:3.6em}
.then i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);flex:none}
.ringrow{display:flex;align-items:center;gap:12px;padding:12px}
.ringrow svg{flex:none;width:168px;height:168px}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.legend div{border:var(--bw) solid var(--ink);border-radius:12px;padding:5px 10px;box-shadow:3px 3px 0 var(--ink);color:#111}
.legend div:nth-child(odd){transform:rotate(1.4deg)} .legend div:nth-child(even){transform:rotate(-1deg)}
.legend b{display:block;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span{font-size:13px;font-weight:600}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.item{padding:14px;display:flex;flex-direction:column;gap:10px}
.item.done{opacity:.7}
.it-h{display:flex;align-items:center;gap:10px}
.it-h .chipc{width:30px;height:30px;border-radius:9px;border:var(--bw) solid var(--ink);flex:none;display:grid;place-items:center;color:#111}
.it-h .chipc svg{width:18px;height:18px}
.it-h .nm{font-family:var(--f-display);font-size:22px;line-height:1.05;flex:1;min-width:0;overflow-wrap:anywhere}
.it-m{font-size:14px;font-weight:600;color:var(--muted);margin-top:-4px}
.it-stats{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.it-stats div{display:flex;flex-direction:column;min-width:0}
.it-stats .k{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.it-stats .v{font-weight:800;font-size:21px;line-height:1.15}
.it-stats .v.cd{font-size:24px}
.it-stats .c2{text-align:center} .it-stats .c3{text-align:right}
.it-note{font-size:14px;font-weight:800}
.it-note.late{color:var(--late)}
.it-ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it-ctl .btn{padding:4px;font-family:var(--f-display);font-weight:400;font-size:16px}
.it-act{display:flex;gap:8px}
.it-act .btn{flex:1}
.endrow{display:flex;justify-content:center;padding-top:4px}

/* ---------- PLAN ---------- */
.step-h{display:flex;align-items:center;gap:8px}
.step-h .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.pl-list{display:flex;flex-direction:column;gap:12px}
.pl-item{background:var(--card);border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:10px 10px 10px 12px;display:flex;gap:10px}
.pl-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pl-top{display:flex;align-items:center;gap:8px}
.pl-top .nm{font-weight:800;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.pl-top .x{width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;color:var(--text)}
.pl-top .x svg{width:16px;height:16px}
.pl-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-ctl select{flex:1;min-width:120px;min-height:44px;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:0 10px;font-weight:600;font-size:16px}
.stepper{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:44px;height:44px;border:0;background:var(--soft);font-size:22px;font-weight:800;color:var(--text)}
.stepper button:active{background:var(--mustard);color:#111}
.stepper output{min-width:54px;text-align:center;font-family:var(--f-display);font-size:18px}
.pl-note{font-size:13px;font-weight:600;color:var(--muted)}
.picker{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:2px 6px 6px 2px;overscroll-behavior:contain}
.pk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:2px solid var(--ink);border-radius:14px;background:var(--card)}
.pk .nm{font-weight:800;flex:1 1 110px;min-width:0}
.pk .opts{display:flex;gap:6px;flex-wrap:wrap}
.timecard{display:flex;flex-direction:column;gap:12px;padding:14px}
.timerow{display:flex;align-items:center;gap:12px}
.ticket{flex:none;background:var(--mustard);color:#111;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:6px 12px;transform:rotate(-2deg);display:flex;flex-direction:column}
.ticket small{font-weight:800;font-size:12px}
.timeinput{font-family:var(--f-display);font-size:40px;line-height:1;border:0;background:transparent;color:#111;padding:0;width:150px;min-height:48px}
.timeinput::-webkit-date-and-time-value{text-align:left}
.tomorrow{font-size:14px;font-weight:800;color:var(--primary)}
.preview{display:flex;flex-direction:column;padding:6px 14px}
.pv{display:grid;grid-template-columns:14px 4em 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:2px dashed var(--grid)}
.pv:last-child{border-bottom:0}
.pv i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink)}
.pv .t{font-weight:800;font-size:17px}
.pv small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.pv.final .t,.pv.final b{color:var(--text)}
.pv.final i{background:var(--lime)}

/* ---------- FOODS ---------- */
.fd-tools{position:sticky;top:-16px;z-index:3;display:flex;flex-direction:column;gap:10px;margin:-16px -16px 0;padding:16px 16px 8px;background:var(--paper)}
.fd-count{font-size:13px;font-weight:700;color:var(--muted);margin:0 4px}
.fd-group{padding:4px 14px}
.fd-group h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:12px 0 2px}
.fd-entry{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--grid);min-height:52px}
.fd-entry:last-child{border-bottom:0}
.fd-entry:active{background:var(--soft)}
.fd-entry .info{min-width:0}
.fd-entry .info b{font-weight:700}
.fd-entry .info small{display:block;color:var(--muted);font-size:13px;font-weight:500;overflow-wrap:anywhere}
.fd-entry .mins{font-family:var(--f-display);font-size:18px}

/* ---------- sheet + toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--paper);width:100%;max-width:560px;border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:92%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.9,.3,1.1)}
.sheet .grab{width:46px;height:6px;border-radius:3px;background:var(--ink);opacity:.35;margin:0 auto}
@keyframes up{from{transform:translateY(100%)}} @keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{animation:none}}
.devgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.devgrid .chip{justify-content:center;border-radius:12px;min-height:48px;padding:6px}
.minrow{display:flex;gap:8px;align-items:center}
.minrow .input{font-family:var(--f-display);font-size:24px;text-align:center;max-width:110px}
.sheet .foot{display:flex;gap:10px}
.sheet .foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%) rotate(-1.5deg);background:var(--mustard);color:#111;border:3px solid #111;box-shadow:4px 4px 0 #111;padding:10px 16px;border-radius:14px;font-weight:800;z-index:30;max-width:calc(100% - 40px);text-align:center;animation:pop .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateX(-50%) scale(.6) rotate(-6deg);opacity:0}}
.install{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--lime);color:#111}
.install svg{width:26px;height:26px;flex:none}
.install p{margin:0;font-weight:600;font-size:14px;flex:1}
.install b{font-weight:800}
.install button{border:0;background:none;font-weight:800;font-size:14px;color:#111;min-height:32px;padding:0}

/* ---------- undo toast ---------- */
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:2px solid #111;background:#fff;color:#111;border-radius:10px;font-weight:800;font-size:15px;min-height:36px;padding:2px 12px}
.toast button:active{transform:translate(2px,2px)}

/* ---------- saved meals + nudges ---------- */
.saved{display:flex;flex-direction:column;gap:6px}
.chip.meal{background:var(--lime);color:#111}
.pl-nudge{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:var(--mustard);color:#111;border:2px solid var(--ink);border-radius:10px;padding:4px 4px 4px 8px;align-self:flex-start}
.pl-nudge svg{width:16px;height:16px}
.pl-nudge.off{background:var(--soft);color:var(--muted)}
.pl-nudge button{border:0;background:none;font-weight:800;font-size:13px;text-decoration:underline;color:inherit;min-height:32px;padding:0 6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.minrow label,.minrow span{white-space:nowrap}

/* ---------- big screen: every timer at once ---------- */
.bigmode .tabs{display:none}
.bigmode .wrap{max-width:none;min-height:100%;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);gap:12px}
.bigbar .servebar{background:var(--card);border:var(--bw) solid var(--ink);border-radius:14px;padding:6px 8px 6px 12px;box-shadow:3px 3px 0 var(--ink)}
.biggrid{flex:1;display:grid;gap:12px;grid-template-columns:1fr;grid-auto-rows:minmax(180px,1fr)}
.biggrid.n4,.biggrid.n5,.biggrid.n6{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(200px,1fr)}
@media (orientation: landscape){.biggrid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:minmax(160px,1fr)}}
.tile{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.hot{background:var(--c);color:#111;animation:hot 1.2s ease-in-out infinite}
.tile.hot .tl-sub,.tile.hot .tl-k{color:#111}
@keyframes hot{0%,100%{box-shadow:5px 5px 0 var(--ink)}50%{box-shadow:9px 9px 0 var(--ink)}}
@media (prefers-reduced-motion: reduce){.tile.hot{animation:none}}
.tl-h{display:flex;align-items:center;gap:8px;min-width:0}
.tl-h .chipc{width:30px;height:30px;border-radius:9px;border:var(--bw) solid var(--ink);flex:none;display:grid;place-items:center;color:#111}
.tl-h .chipc svg{width:18px;height:18px}
.tl-h .nm{font-family:var(--f-display);font-size:22px;line-height:1.05;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.tl-cd{font-family:var(--f-display);font-size:clamp(52px,19vw,104px);line-height:.95;letter-spacing:-.01em}
.tl-cd.long{font-size:clamp(40px,13vw,76px)}
.n4 .tl-cd,.n5 .tl-cd,.n6 .tl-cd{font-size:clamp(34px,10vw,60px)}
.n4 .tl-cd.long,.n5 .tl-cd.long,.n6 .tl-cd.long{font-size:clamp(26px,7.5vw,44px)}
.n4 .tl-h .nm,.n5 .tl-h .nm,.n6 .tl-h .nm{font-size:17px}
.n4 .tl-h .pill,.n5 .tl-h .pill,.n6 .tl-h .pill{display:none}
.tl-k{font-weight:800;font-size:16px;color:var(--muted)}
.tl-sub{font-weight:600;font-size:14px;color:var(--muted)}
.tl-act{display:flex;gap:8px}
.tl-act .btn{flex:1;min-width:0;padding:4px 8px}
.tl-act .btn.sm{flex:0 0 auto;min-width:52px;font-family:var(--f-display);font-weight:400}
.tl-act .btn.big{min-height:52px}
.n4 .tl-act,.n5 .tl-act,.n6 .tl-act{flex-wrap:wrap}
.bigdone{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 6px}
.bigdone svg{width:20px;height:20px;flex:none;color:var(--text)}
/* big screen fit: one-row bar, tiles share the screen height */
.bigbar .servebar{flex-wrap:nowrap}
.bigbar .serve{flex-wrap:nowrap;min-width:0}
.bigbar .serve .t{font-size:22px}
.biggrid{grid-auto-rows:minmax(150px,1fr)}
.tl-cd{font-size:clamp(48px,17vw,88px)}
.tile.hot .btn.go,.tile.hot .btn.sm{background:#fff;color:#111}

/* ---------- alert banners (drop from the top, like iPhone notifications) ---------- */
.banners{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:25;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:540px;margin:0 auto}
.bn{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--text);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:10px 8px 10px 10px;animation:drop .32s cubic-bezier(.2,.9,.3,1.2);touch-action:none;transition:opacity .15s}
@keyframes drop{from{transform:translateY(-120%);opacity:0}}
@media (prefers-reduced-motion: reduce){.bn{animation:none}}
.bn-c{flex:none;width:40px;height:40px;border-radius:12px;border:var(--bw) solid var(--ink);background:var(--c);color:#111;display:grid;place-items:center}
.bn-c svg{width:22px;height:22px}
.bn-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bn-t b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.1;overflow-wrap:anywhere}
.bn-t span{font-size:13px;font-weight:600;color:var(--muted)}
.bn .btn.sm{flex:none;min-height:44px}
.bn-x{flex:none;width:32px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.bn-x svg{width:18px;height:18px}
.tunegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tunegrid .chip{justify-content:flex-start;border-radius:12px;min-height:44px}
.tunegrid .chip svg{width:15px;height:15px}

</style>

<script>
/* Ding! scheduling engine.
 * One pure function turns the meal state + the current time into the whole schedule.
 * Nothing displayed is ever "edited"; it is always recomputed from:
 *   meal.targetAt   – the serving time the user asked for (epoch ms)
 *   meal.mode       – 'together' (move serving time so everything finishes together)
 *                     'keep'     (hold the original serving time; late items are shown as late)
 *   item.baseMs     – planned cooking time
 *   item.adjustMs   – sum of +/- adjustments
 *   item.startedAt  – actual start (epoch ms) or null
 *   item.doneAt     – actual finish (epoch ms) or null
 * All maths is in integer milliseconds. Rounding happens only when formatting.
 */
(function (root) {
  'use strict';
  var MIN = 60000;

  function durationOf(it) {
    return Math.max(0, (it.baseMs || 0) + (it.adjustMs || 0));
  }

  // Where a nudge falls inside a food's cooking time (ms after its start), or null.
  // nudge = { mode: 'half' | 'at', atMin, text }. Acknowledged nudges (nudgedAt) are gone.
  function nudgeOffset(it, D) {
    var n = it.nudge;
    if (!n || it.nudgedAt != null) return null;
    var off = n.mode === 'at' ? (n.atMin || 0) * MIN : Math.round(D / 2);
    return off > 0 && off < D ? off : null;
  }

  function computeSchedule(meal, now) {
    var target = meal.targetAt;
    var together = meal.mode !== 'keep';

    // 1. Serving time. In 'together' mode it is the latest of: the requested time,
    //    the finish of anything already cooking, and now + duration for anything not yet started
    //    (it cannot finish sooner than that). It never moves earlier than the requested time.
    var serveAt = target;
    if (together) {
      meal.items.forEach(function (it) {
        if (it.doneAt != null) return;
        var D = durationOf(it);
        var f = it.startedAt != null ? it.startedAt + D : now + D;
        if (f > serveAt) serveAt = f;
      });
    }

    // 2. Each item from the same serving time.
    var rows = meal.items.map(function (it) {
      var D = durationOf(it);
      var r = { id: it.id, durationMs: D, adjustMs: it.adjustMs || 0 };
      if (it.doneAt != null) {
        r.status = 'done';
        r.startAt = it.startedAt != null ? it.startedAt : it.doneAt - D;
        r.finishAt = it.doneAt;
        r.countdownMs = 0;
      } else if (it.startedAt != null) {
        r.startAt = it.startedAt;
        r.finishAt = it.startedAt + D;
        r.countdownMs = r.finishAt - now;               // time left (negative = overdue to take out)
        r.status = r.countdownMs <= 0 ? 'ready' : 'cooking';
      } else {
        r.startAt = serveAt - D;                         // the one scheduling equation
        r.countdownMs = r.startAt - now;                 // time until start (negative = overdue)
        r.status = r.countdownMs <= 0 ? 'start' : 'waiting';
        r.finishAt = Math.max(r.startAt, now) + D;       // if overdue it can only finish from now
      }
      r.lateMs = r.status === 'done' ? 0 : Math.max(0, r.finishAt - target);
      r.earlyMs = r.status === 'done' ? 0 : Math.max(0, serveAt - r.finishAt);

      var off = nudgeOffset(it, D);
      r.nudgeAt = null; r.nudgeDue = false;
      if (off != null) {
        if (r.status === 'cooking') { r.nudgeAt = it.startedAt + off; r.nudgeDue = now >= r.nudgeAt; }
        else if (r.status === 'waiting' || r.status === 'start') r.nudgeAt = Math.max(r.startAt, now) + off; // projected
      }
      return r;
    });

    // 3. Meal summary.
    var active = rows.filter(function (r) { return r.status !== 'done'; });
    var latest = active.reduce(function (m, r) { return Math.max(m, r.finishAt); }, -Infinity);
    var summary = {
      targetAt: target,
      serveAt: together ? serveAt : target,
      latestFinishAt: active.length ? latest : null,
      delayMs: active.length ? Math.max(0, latest - target) : 0,
      allDone: rows.length > 0 && active.length === 0
    };

    // 4. Events in the order the cook meets them. Urgent ones (due now or overdue) first.
    var events = [];
    rows.forEach(function (r) {
      if (r.status === 'start' || r.status === 'waiting') events.push({ id: r.id, type: 'start', at: r.startAt, urgent: r.status === 'start' });
      else if (r.status === 'cooking' || r.status === 'ready') events.push({ id: r.id, type: 'finish', at: r.finishAt, urgent: r.status === 'ready' });
      if (r.nudgeAt != null && r.nudgeAt < r.finishAt) events.push({ id: r.id, type: 'nudge', at: r.nudgeAt, urgent: r.nudgeDue });
    });
    var rank = { finish: 0, nudge: 1, start: 2 }; // take out, then shake, then start the next thing
    events.sort(function (a, b) {
      if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;

  }

  // Next occurrence of a wall-clock time (today if still ahead, otherwise tomorrow).
  function nextOccurrence(hh, mm, now) {
    var d = new Date(now);
    d.setHours(hh, mm, 0, 0);
    if (d.getTime() <= now) { d.setDate(d.getDate() + 1); d.setHours(hh, mm, 0, 0); }
    return d.getTime();
  }

  // Earliest whole-minute time everything could finish if started now.
  function earliestFinish(durationsMs, now) {
    var longest = durationsMs.reduce(function (m, d) { return Math.max(m, d); }, 0);
    return Math.ceil((now + longest) / MIN) * MIN;
  }

  // New adjustment after pressing +/- on an item. Keeps durations sensible:
  // an unstarted item stays at least 1 minute; a cooking item can't end before now.
  function adjustedMs(it, deltaMs, now) {
    var D = durationOf(it);
    var floor = it.startedAt != null ? Math.max(0, now - it.startedAt) : MIN;
    var next = Math.max(floor, D + deltaMs);

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.CookEngine = api;
})(this);

  // Converge rings: one ring per food, the dial's top is the moment everything is ready.

  window.addEventListener('pointermove', function (e) { if (swipe) { var dy = Math.min(0, e.clientY - swipe.y); swipe.el.style.transform = 'translateY(' + dy + 'px)'; swipe.el.style.opacity = String(1 + dy / 120); } });
  window.addEventListener('pointerup', function (e) {
    if (!swipe) return; var dy = e.clientY - swipe.y, el = swipe.el; swipe = null;
    if (dy < -40) { var k = el.getAttribute('data-key'); banners = banners.filter(function (b) { return b.key !== k; }); syncBanners(Date.now()); }
    else { el.style.transform = ''; el.style.opacity = ''; }
  });

  function checkAlerts(now) {
    if (!meal) { if (banners.length) { banners = []; syncBanners(now); } return; }
    var s = sched(now), first = !Object.keys(prevStatus).length;
    s.rows.forEach(function (r) {
      var p = prevStatus[r.id], it = itemOf(r.id);
      if (!first && p) {
        if (p === 'waiting' && r.status === 'start') { alertSound('start', it); addBanner(r.id, 'start', now); }
        else if (p === 'cooking' && r.status === 'ready') { alertSound('ready', it); addBanner(r.id, 'ready', now); }
        else if (r.nudgeDue && !prevStatus[r.id + ':n']) { alertSound('nudge', it); addBanner(r.id, 'nudge', now); }
        else if (r.status === 'waiting' && prevStatus[r.id + ':cd'] > 60000 && r.countdownMs <= 60000) { alertSound('soon', it); addBanner(r.id, 'soon', now); }
      }
      prevStatus[r.id] = r.status; prevStatus[r.id + ':cd'] = r.countdownMs; prevStatus[r.id + ':n'] = r.nudgeDue;
    });
    syncBanners(now);
  }

  /* ---------- clock ---------- */
  function tick() {
    var now = Date.now();
    checkAlerts(now);
    var focusInView = document.activeElement && $view.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
    if (!ui.sheet && !focusInView && structureKey(now) !== lastKey) render(); else bind(now);
  }

  render();
  setInterval(tick, 250);
  if (meal) requestWake();

  /* ---------- offline install (only when hosted as a standalone app) ---------- */
  try {
    if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:' && document.querySelector('link[rel="manifest"]')) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  } catch (e) {}
})();

</script>
</body>
